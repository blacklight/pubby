[package]
name = "pubby-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dev-dependencies]
pubby-sdk = { path = "../../src/rust", features = ["db", "axum", "async"] }
serde_json = "1"
tempfile = "3"
chrono = "0.4"
futures = "0.3"
futures-timer = "3"
sha2 = "0.10"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
