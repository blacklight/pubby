[package]
name = "pubby-sdk"
version = "0.6.3"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "A general-purpose library to add ActivityPub federation support to your web application"
readme = "README.md"
homepage = "https://git.fabiomanganiello.com/pubby"
repository = "https://github.com/blacklight/pubby"
keywords = ["activitypub", "fediverse", "federation", "mastodon"]
categories = ["web-programming"]

[features]
default = []
# SQLite-backed storage adapter (rusqlite)
db = ["dep:rusqlite"]
# Redis-backed DocumentStore (redis crate, sync client)
redis = ["dep:redis"]
# Async single-flight support for DocumentCache (get_or_render_async)
async = ["dep:futures", "dep:futures-timer"]
# axum web-framework adapter
axum = ["dep:axum", "dep:tower"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
rsa = "0.9"
rand = "0.8"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
idna = "1"
base64 = "0.22"
regex = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
ureq = "3"
minijinja = "2"
percent-encoding = "2"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
redis = { version = "0.27", optional = true }
futures = { version = "0.3", optional = true }
futures-timer = { version = "3", optional = true }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }

[dev-dependencies]
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
